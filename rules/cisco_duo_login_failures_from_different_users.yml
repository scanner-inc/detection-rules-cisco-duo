# schema: https://scanner.dev/schema/scanner-detection-rule.v1.json
name: Cisco Duo Login Failures From Different Users
description: |-
  Detect failed login attempts from different users.
  This can indicate potential brute force attacks or
  credential stuffing attempts.
severity: High
query_text: |-
  @scnr.source_type:cisco_duo
  event_type:authentication
  result:(denied failure)
  | countdistinct(username)
  | where @q.uniq > 10
time_range_s: 600
run_frequency_s: 60
event_sink_keys:
- high_severity_alerts
tags:
- tactics.ta0001.initial_access
- techniques.t1078.valid_accounts
- source.cisco-duo
tests:
  - name: Failures from 11 different users
    now_timestamp: "2024-08-21T00:03:00.000Z"
    dataset_inline: |
      {"timestamp":"2024-08-21T00:02:00.000Z","@scnr.source_type":"cisco_duo","event_type":"authentication","result":"denied","username":"user0"}
